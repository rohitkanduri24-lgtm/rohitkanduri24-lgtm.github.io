name: Deploy portfolio

on:
  push:
    branches: [main]
    paths: ["site.b64", "patches/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unpack source bundle and apply patches
        run: |
          mkdir -p /tmp/app
          base64 -d site.b64 | tar xz -C /tmp/app
          for p in patches/*.patch; do patch -p1 -d /tmp/app < "$p"; done
      - name: Install and build
        working-directory: /tmp/app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
